# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
# This file is used to configure the build and deployment of your Next.js app.
runConfig:
  # Increase this value to automatically spin up more instances in response to increased traffic.
  maxInstances: 1

# Tells App Hosting how to build your Next.js application.
build:
  - sh: npm install
  - sh: npm run build

# The start command for your Next.js server.
# This is what App Hosting runs after the build is complete.
start: npm run start
